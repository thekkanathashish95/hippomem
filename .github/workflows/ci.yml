# CI — pytest, ruff, bandit, and blocking pip-audit on 3.11/3.12.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check hippomem tests

      - name: Tests
        run: pytest tests -q --tb=short

      - name: Bandit
        run: bandit -r hippomem -ll

      - name: pip-audit
        run: pip-audit
